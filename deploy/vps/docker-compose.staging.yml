# SmartEinzug: Override fuer die Staging-Umgebung (staging.smart-einzug.de). Immer zusammen mit
# docker-compose.yml verwenden:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file .env up -d
#
# Staging laeuft auf einem eigenen, kleineren VPS (oder klein dimensionierten Server) mit eigener
# Coolify-Datenbankressource (eigener Containername in shared/config.php) und eigenem .env; es ist NICHT
# dieselbe Datenbank wie Produktion. Nur EIN
# Lexware-Worker (worker-lexware-2 ist ueber ein Profil abgeschaltet), engere Ressourcenlimits und
# kleinere Speichergrenzen fuer MariaDB und Redis; Log-Rotation wie in Produktion.
#
# Isolation von Produktion (siehe docs/vps/06-betrieb.md, Abschnitt "Staging- und
# Produktionsisolation"): Der eigene Projektname "smarteinzug-staging" unten sorgt dafuer, dass JEDE
# von Compose verwaltete Ressource (Container, Netz "smarteinzug_internal", Volumes "caddy_data"/
# "caddy_config") automatisch mit dem Prefix "smarteinzug-staging_" versehen wird und damit selbst bei
# versehentlichem Aufruf auf demselben Host niemals gleichnamige Produktionsressourcen trifft oder
# ueberschreibt. Aus demselben Grund tragen die Traefik-Labels unten eigene Router-/Middleware-/
# Dienstnamen ("smarteinzug-staging-*" statt "smarteinzug-*"): Traefik kennt keine Projektnamen, zwei
# Container mit identischen Routernamen auf demselben Coolify-Proxy wuerden sich sonst gegenseitig
# ueberschreiben, unabhaengig vom Compose-Projekt.
name: smarteinzug-staging

services:
  caddy:
    mem_limit: 96m
    cpus: "0.25"
    # Staging bedient nur einen Host (staging.smart-einzug.de) und nutzt dafuer eine eigene
    # Caddyfile; DOMAIN_STAGING kommt aus der Staging-.env, die uebrigen DOMAIN_*-Variablen aus
    # der Basis-Datei bleiben ungenutzt, wenn sie in der Staging-.env leer sind.
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /opt/smarteinzug/releases:/opt/smarteinzug/releases:ro
    environment:
      DOMAIN_STAGING: ${DOMAIN_STAGING}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${COOLIFY_NETWORK:-coolify}
      # Eigene Router-/Middleware-/Dienstnamen "smarteinzug-staging-*": Traefik kennt keine
      # Compose-Projektnamen, nur die Labels selbst. Wuerden hier dieselben Namen wie in
      # docker-compose.prod.yml verwendet, wuerde der zuletzt gestartete Container (Produktion oder
      # Staging) den Router des jeweils anderen ueberschreiben, sobald beide am selben Traefik-Proxy
      # (Coolify-Netz) haengen.
      traefik.http.routers.smarteinzug-staging-http.rule: Host(`${DOMAIN_STAGING}`)
      traefik.http.routers.smarteinzug-staging-http.entrypoints: http
      traefik.http.routers.smarteinzug-staging-http.middlewares: smarteinzug-staging-redirect
      traefik.http.middlewares.smarteinzug-staging-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.smarteinzug-staging-redirect.redirectscheme.permanent: "true"
      traefik.http.routers.smarteinzug-staging-https.rule: Host(`${DOMAIN_STAGING}`)
      traefik.http.routers.smarteinzug-staging-https.entrypoints: https
      traefik.http.routers.smarteinzug-staging-https.tls: "true"
      traefik.http.routers.smarteinzug-staging-https.tls.certresolver: letsencrypt
      traefik.http.routers.smarteinzug-staging-https.service: smarteinzug-staging
      traefik.http.services.smarteinzug-staging.loadbalancer.server.port: "80"

  php:
    mem_limit: 256m
    cpus: "0.50"

  scheduler:
    mem_limit: 96m
    cpus: "0.15"

  worker-lexware-1:
    mem_limit: 384m
    cpus: "0.25"

  # Zweiter Lexware-Worker in Staging nicht starten: ein Profil, das nie aktiviert wird, nimmt den
  # Dienst aus "up -d", "ps" und "restart" heraus, ohne die Basis-Datei zu veraendern.
  worker-lexware-2:
    profiles: ["nicht-aktiv"]

  worker-sevdesk:
    mem_limit: 256m
    cpus: "0.15"

  worker-stripe:
    mem_limit: 256m
    cpus: "0.25"

  worker-mail:
    mem_limit: 192m
    cpus: "0.15"

  worker-maintenance:
    mem_limit: 192m
    cpus: "0.15"

  metrics:
    mem_limit: 96m
    cpus: "0.15"

  redis:
    mem_limit: 192m
    cpus: "0.15"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "96mb"]
