# SmartEinzug: Redis-Konfiguration (Sperren, zentrale API-Ratenbegrenzung, Cache). Kein dauerhafter
# Datenbestand: geht der Container verloren, baut sich der Zustand aus der Datenbank neu auf
# (config('redis') ist in app/config.php ausdruecklich optional, siehe app/redis.php).
#
# Erreichbar ausschliesslich ueber das interne Docker-Netz (smarteinzug_internal, internal: true);
# docker-compose.yml veroeffentlicht fuer diesen Dienst bewusst keinen Port nach aussen.
#
# protected-mode no (bewusst, siehe docs/vps/06-betrieb.md, Abschnitt "Stoerung: Redis protected
# mode"): Redis lehnt OHNE ein gesetztes Passwort (kein requirepass hier, siehe oben) jeden Befehl
# eines NICHT-loopback-Clients ab ("DENIED ... running in protected mode ..."), auch wenn "bind"
# explizit gesetzt ist - das betrifft ausnahmslos JEDEN Zugriff aus einem anderen Container (php,
# scheduler, worker, die isolierte Candidate-Pruefung), da diese nie ueber 127.0.0.1 verbinden. Nur
# ein "docker exec ... redis-cli ping" INNERHALB des redis-Containers selbst laeuft ueber Loopback
# und bleibt davon unberuehrt, taeuscht also faelschlich Gesundheit vor. Da dieser Dienst ohnehin
# ausschliesslich ueber das interne, nicht ueffentlich erreichbare Docker-Netz erreichbar ist (siehe
# oben) und kein Passwort vorgesehen ist, bietet protected-mode hier keinen zusaetzlichen Schutz,
# verhindert aber den vorgesehenen Betrieb. Redis' eigene Fehlermeldung nennt dies selbst als Loesung
# ("just disable protected mode ... however MAKE SURE Redis is not publicly accessible from the
# internet if you do so" - hier bereits durch "internal: true" und keinen veroeffentlichten Port
# sichergestellt).
bind 0.0.0.0 -::1
protected-mode no
port 6379

maxmemory 256mb
maxmemory-policy volatile-lru

# Kein Append-Only-File und keine RDB-Snapshots: reine Laufzeitdaten, ein Neustart darf sie verlieren.
appendonly no
save ""

# Ausfuehrliche Aenderungsprotokolle sind fuer Sperren/Rate-Limiting nicht sinnvoll und kosten Speicher.
maxmemory-samples 5
loglevel notice
