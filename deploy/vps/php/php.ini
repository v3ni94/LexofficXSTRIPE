; SmartEinzug: gemeinsame php.ini-Ergaenzung fuer Web, Scheduler und Worker (deploy/vps/php/Dockerfile
; kopiert diese Datei nach /usr/local/etc/php/conf.d/zz-smarteinzug.ini, "zz-" damit sie nach den
; Standarddateien des Basisimages geladen wird und deren Werte ueberschreibt).
;
; memory_limit gilt hier fuer den Web-Prozess (php-fpm, 256M laut Vorgabe). Die Worker- und
; Scheduler-Container ueberschreiben memory_limit gezielt per CLI-Flag
; "php -d memory_limit=${WORKER_MEMORY_MB}M ..." (siehe docker-compose.yml), damit ein einziger Wert
; (WORKER_MEMORY_MB in .env) fuer alle Hintergrundprozesse gilt, ohne den Web-Wert zu beeinflussen.
memory_limit = 256M

; Zeitbudgets der Anwendung (Cron/Sync-Schritte, Job-Versuche) liegen deutlich darunter; ein
; grosszuegiges max_execution_time verhindert nur, dass ein haengender Prozess zu frueh abbricht.
max_execution_time = 120
max_input_time = 60

; --- OPcache ------------------------------------------------------------------------------------
; validate_timestamps=0: OPcache prueft Dateien NICHT mehr auf Aenderung (Produktionsbetrieb,
; spuerbar schnellere Ausfuehrung). WICHTIG: dadurch sieht ein Container ein neu ausgeliefertes
; Release erst nach einem Neuladen von php-fpm. scripts/deploy.sh reloadet php-fpm deshalb nach
; jedem Symlink-Wechsel (current -> neues Release) per SIGUSR2 an den php-fpm-Masterprozess -
; ein manueller Codewechsel ohne diesen Reload wird sonst NICHT wirksam.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 12000

; --- Sitzungen ------------------------------------------------------------------------------------
; Gemeinsamer Bind-Mount (/opt/smarteinzug/shared/sessions, siehe docker-compose.yml), von Web, Scheduler und allen Workern
; gemeinsam genutzt, damit eine Sitzung unabhaengig vom bedienenden php-fpm-Container gueltig bleibt.
session.save_handler = files
session.save_path = "/var/lib/php/sessions"

; --- Sicherheit und Protokollierung -----------------------------------------------------------------
; expose_php Off: keine PHP-Version im Antwort-Header.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; stderr: von Docker eingesammelt (json-file-Treiber, siehe x-logging in docker-compose.yml),
; kein zusaetzliches Logdateimanagement im Container noetig.
error_log = /dev/stderr

; Zeitzone wird zusaetzlich in app/bootstrap.php aus der Anwendungskonfiguration gesetzt
; (config('timezone')); dieser Wert ist der Rahmen fuer PHP-Funktionen vor dem Bootstrap.
date.timezone = "Europe/Berlin"

; Upload-Grenzen (Mandatsdokumente, Firmenlogo/Avatar) grosszuegig, aber begrenzt.
upload_max_filesize = 12M
post_max_size = 14M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
