; SmartEinzug: php-fpm-Pool "www". Ersetzt die Standarddatei des Basisimages vollstaendig
; (deploy/vps/php/Dockerfile kopiert diese Datei nach /usr/local/etc/php-fpm.d/www.conf).
;
; Diese Datei wird nur vom "php"-Dienst (Web) tatsaechlich als FPM-Pool verwendet; Scheduler und
; Worker ueberschreiben den Container-Befehl (command:) und starten php-fpm gar nicht erst, die
; Pool-Einstellungen sind fuer sie damit wirkungslos, schaden aber auch nicht.
[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

; PHP-FPM ersetzt ${VARNAME}-Ausdruecke in dieser Datei durch die Prozessumgebung (siehe
; php-fpm.conf.default-Kommentare); PM_MAX_CHILDREN kommt aus .env ueber docker-compose.yml
; (environment: PM_MAX_CHILDREN) auf den php-Container.
pm = dynamic
pm.max_children = ${PM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Langsame Anfragen protokollieren (Diagnose), ohne den Prozess zu beenden.
request_slowlog_timeout = 10s
slowlog = /dev/stderr

; Zugriffs- und Fehlerprotokoll ueber stdout/stderr, von Docker eingesammelt (siehe x-logging).
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
