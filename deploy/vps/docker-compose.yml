# SmartEinzug: Basis-Compose-Datei fuer den IONOS VPS.
# Kein "version:"-Schluessel mehr: das Compose-Spezifikationsformat (Docker Compose v2) benoetigt ihn
# nicht, ein gesetzter Wert wird von aktuellen Compose-Versionen nur noch als veraltet gemeldet.
#
# Diese Datei allein wird nie gestartet, sondern immer zusammen mit genau einem Override:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml    --env-file .env up -d
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file .env up -d
#
# Grundsaetze (siehe README.md):
#  - Kein Datenbank- oder Redis-Port wird nach aussen veroeffentlicht. Auch Caddy veroeffentlicht keine
#    Ports: Auf dem Hostinger-VPS (Ubuntu 24.04 mit Coolify) haelt der Coolify-Proxy (Traefik) die Ports
#    80/443, beendet TLS (Let's Encrypt) und reicht Anfragen ueber das Docker-Netz COOLIFY_NETWORK an
#    unseren Caddy weiter (Traefik-Labels am caddy-Dienst). Caddy ist damit nur noch der interne
#    HTTP-Server vor php-fpm (Sicherheitsregeln, php_fastcgi, statische Dateien). Kein zweiter Reverse
#    Proxy auf 80/443, kein Konflikt mit Coolify.
#  - KEINE eigene Datenbank in diesem Stack: MariaDB (11.8) laeuft bereits als private Coolify-
#    Datenbankressource (Datenbank smarteinzug, kein oeffentlicher Port, taegliche Coolify-Backups mit
#    externem Ziel Hetzner Object Storage, Restore getestet). PHP, Scheduler, Worker und Metrics haengen
#    deshalb zusaetzlich am Coolify-Netz und erreichen den Datenbank-Container ueber seinen Containernamen
#    (db.host in shared/config.php = Containername der Coolify-MariaDB, Port 3306). Dasselbe Netz liefert
#    den Anwendungscontainern den Weg ins Internet (Lexware Office, Stripe, Mail); smarteinzug_internal
#    bleibt ein Netz ohne Aussenverbindung fuer Caddy<->php und Redis.
#  - KEIN eigener Backup-Container: die Datenbanksicherung uebernimmt Coolify. Der Metrik-Sammler liest
#    nur die lokale Kopie der Coolify-Backups (COOLIFY_BACKUP_DIR, read-only) fuer die Anzeige im Admin.
#  - Der Code des aktiven Release wird nur LESEND eingebunden. working_dir zeigt NICHT auf einen
#    mutable Symlink ("current"), sondern direkt auf /opt/smarteinzug/releases/${RELEASE_SHA} (die
#    Variable exportieren deploy.sh/rollback.sh vor jedem "docker compose"-Aufruf auf das jeweils
#    gemeinte Release). Damit gehoeren Compose-Konfiguration (inklusive Healthchecks), Image und
#    Anwendungscode bei jedem Containerstart garantiert zum selben Release; ein Container kann nicht
#    mit neuer Konfiguration (z.B. einem neuen Healthcheck-Modus) auf aelteren Code treffen. Der
#    Symlink /opt/smarteinzug/releases/current bleibt als Buchfuehrung fuer Menschen und Werkzeuge
#    bestehen (siehe deploy.sh), hat fuer die Container selbst aber keine Bedeutung mehr.
#    config.php und storage/ liegen ausserhalb der Releases unter /opt/smarteinzug/shared/ und werden
#    gesondert eingebunden. Der Container sieht NICHT das gesamte /opt/smarteinzug (dort liegen
#    deploy/.env, Backups und Logs, die kein Anwendungscontainer lesen darf).
#  - worker-lexware-2 (zweiter Lexware-Worker) ist hier definiert, wird aber in Staging ueber ein
#    Profil deaktiviert (docker-compose.staging.yml); Produktion setzt nur Ressourcenlimits.
#  - stop_grace_period 660 s fuer Scheduler und Worker: ein laufender Sync-Abschnitt darf bis zu 600 s
#    dauern (jobs.sync_attempt_seconds), SIGTERM beendet ihn kontrolliert und gibt den Job frei.

name: smarteinzug

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-php-build: &php-build
  context: ./php
  dockerfile: Dockerfile

# Code-Mounts, die jeder PHP-Container (Web, Scheduler, Worker) in derselben Form braucht.
# Das aktive Release und die produktive Konfiguration sind read_only: ein Container darf den
# eigenen Code nicht veraendern. shared/storage ist beschreibbar (Mandate, Avatare, Logs,
# maintenance.flag, backup-status.json), shared/sessions traegt die PHP-Sitzungen aller Container.
x-code-mounts: &code-mounts
  # Der GESAMTE Ordner /opt/smarteinzug/releases wird nur lesend eingebunden (alle vorgehaltenen
  # Releases, siehe deploy.sh: die letzten 5 bleiben erhalten); working_dir (siehe x-php-common unten)
  # zeigt aber gezielt auf den Unterordner des konkret gemeinten Release (${RELEASE_SHA}), NICHT auf
  # den Symlink "current". Ein Release-Wechsel erfordert deshalb bewusst einen Container-Neustart
  # (durch die geaenderte Umgebungsvariable RELEASE_SHA erkennt Compose das als Konfigurationsaenderung
  # und erzeugt die Container neu); es reicht kein reiner php-fpm-Reload mehr, dafuer gibt es aber auch
  # keinen Zeitraum mehr, in dem Compose-Konfiguration und tatsaechlicher Code auseinanderlaufen koennen.
  - type: bind
    source: /opt/smarteinzug/releases
    target: /opt/smarteinzug/releases
    read_only: true
  - type: bind
    source: /opt/smarteinzug/shared/config.php
    target: /opt/smarteinzug/shared/config.php
    read_only: true
  - type: bind
    source: /opt/smarteinzug/shared/storage
    target: /opt/smarteinzug/shared/storage
  - type: bind
    source: /opt/smarteinzug/shared/sessions
    target: /var/lib/php/sessions

x-php-common: &php-common
  build: *php-build
  image: smarteinzug-php:local
  restart: unless-stopped
  user: "${APP_UID:-33}:${APP_GID:-33}"
  # coolify: Datenbank (Coolify-MariaDB) und Internet; smarteinzug_internal: Caddy und Redis.
  networks: [coolify, smarteinzug_internal]
  # NICHT "/opt/smarteinzug/releases/current" (mutable Symlink): working_dir bindet den Container direkt
  # an ein konkretes Release, exportiert von deploy.sh/rollback.sh vor jedem Compose-Aufruf. Ohne Wert
  # bricht "docker compose" mit einer klaren Fehlermeldung ab (":?"), statt still auf irgendeinen
  # Vorgabewert zurueckzufallen - ein Ruecksprung auf "current" waere genau der Fehler, den diese
  # Bindung verhindern soll (siehe x-code-mounts oben).
  working_dir: /opt/smarteinzug/releases/${RELEASE_SHA:?RELEASE_SHA muss vor jedem Compose-Aufruf gesetzt sein (deploy.sh/rollback.sh exportieren ihn automatisch; fuer manuelle Aufrufe siehe README.md, Abschnitt Start)}
  environment: &php-common-env
    TZ: ${TZ:-Europe/Berlin}
    # Konfiguration und Speicher liegen ausserhalb der Releases (siehe app/bootstrap.php, storage_dir()).
    SMARTEINZUG_CONFIG: /opt/smarteinzug/shared/config.php
    # Redis-Hostname kommt aus dem Stack, NICHT aus shared/config.php ('host' => 'redis'): Der Hostname
    # "redis" ist auf einem Coolify-Server MEHRDEUTIG. Coolifys eigener Stack definiert ebenfalls einen
    # Dienst "redis" (Container coolify-redis, mit Passwort) im gemeinsam genutzten Netz "coolify", an dem
    # unsere PHP-Container fuer Datenbank und Internet ebenfalls haengen. Dockers eingebetteter DNS
    # beantwortet "redis" dann aus dem Netz mit Gateway (coolify) ZUERST, d.h. mit Coolifys Redis - die
    # Folge war "NOAUTH Authentication required" (gemeldet als "redis: other" bzw. "redis: auth"), obwohl
    # unser Redis kein Passwort verlangt (siehe docs/vps/06-betrieb.md, Abschnitt "Redis-Alias-Kollision").
    # Unser Redis traegt deshalb den eindeutigen Alias "smarteinzug-redis" (siehe Dienst redis unten), den
    # es nur im internen Netz gibt; app/redis.php bevorzugt diese Variable vor config('redis')['host'].
    SMARTEINZUG_REDIS_HOST: smarteinzug-redis
    # Erwartetes Netz des Redis-Dienstes (Subnetz von smarteinzug_internal, siehe networks unten):
    # bin/healthcheck.php --redis meldet "network_mismatch", wenn der Hostname in ein anderes Netz aufloest.
    SMARTEINZUG_REDIS_EXPECTED_CIDR: 172.28.0.0/24
  volumes: *code-mounts
  logging: *default-logging

# Scheduler und Worker: identisch zu php-common, zusaetzlich langer Stop-Grace fuer laufende Jobs
# und der Heartbeat-Healthcheck. Dieser Anker gilt NUR fuer Prozesse, die ueber bin/worker.php bzw.
# bin/scheduler.php einen Heartbeat schreiben; der Metrik-Sammler hat einen eigenen Healthcheck
# (--metrics), siehe Dienst "metrics" weiter unten.
x-php-background: &php-background
  <<: *php-common
  stop_grace_period: 660s
  healthcheck: &heartbeat-healthcheck
    test: ["CMD", "php", "bin/healthcheck.php", "--heartbeat"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

networks:
  # coolify: das bereits vorhandene Netz von Coolify (Standardname "coolify", auf dem Server mit
  # "docker network ls" pruefen). Darin laufen der Coolify-Proxy (Traefik) und die Coolify-MariaDB.
  # Caddy haengt daran fuer den Proxy, die PHP-Container fuer Datenbank und Internetzugang.
  coolify:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}
  # smarteinzug_internal: kein Zugriff von aussen (internal: true). Fester Adressbereich, damit die
  # Adressen der Container vorhersagbar bleiben. Hinweis: TLS endet am Coolify-Proxy, deshalb muss
  # trusted_proxies in app/config.php die Docker-Netzbereiche enthalten (z.B. ['172.16.0.0/12',
  # '10.0.0.0/8']), damit X-Forwarded-Proto und X-Forwarded-For (von rechts ausgewertet) gelten.
  smarteinzug_internal:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  caddy_config:

services:
  # --- Reverse Proxy -----------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [coolify, smarteinzug_internal]
    # Keine "ports:": 80/443 gehoeren dem Coolify-Proxy. Traefik findet diesen Container ueber die Labels.
    environment:
      DOMAIN_APP: ${DOMAIN_APP}
      DOMAIN_ADMIN: ${DOMAIN_ADMIN}
      DOMAIN_API: ${DOMAIN_API}
      DOMAIN_STATUS: ${DOMAIN_STATUS}
      # Caddy verwendet {$RELEASE_SHA} in der Caddyfile (Caddy-eigene Umgebungsvariablen-Syntax, nicht
      # zu verwechseln mit Docker Compose's ${...}) als Dokumentenstamm; dieselbe Bindung wie bei den
      # PHP-Containern, damit Caddy IMMER denselben Code ausliefert, den php-fpm ausfuehrt.
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA muss vor jedem Compose-Aufruf gesetzt sein}
    # KEINE Traefik-Labels hier: Sie stehen ausschliesslich im jeweiligen Umgebungs-Override
    # (docker-compose.prod.yml bzw. docker-compose.staging.yml) mit je eigenen, eindeutigen
    # Router-/Middleware-/Dienstnamen (smarteinzug-* bzw. smarteinzug-staging-*). Stuenden die
    # Labels hier in der Basis-Datei, wuerden Produktion UND Staging beim Zusammenfuehren
    # zwangslaeufig dieselben Router-Namen erhalten (siehe docs/vps/06-betrieb.md, Abschnitt
    # "Staging- und Produktionsisolation").
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Nur die Releases (Dokumentenstamm ist das durch RELEASE_SHA gebundene Release, siehe Caddyfile;
      # die Statusseite liegt im selben Release unter status/); kein Zugriff auf shared/, deploy/,
      # backups/, logs/.
      - /opt/smarteinzug/releases:/opt/smarteinzug/releases:ro
    depends_on:
      php:
        condition: service_healthy
    logging: *default-logging

  # --- Web (php-fpm) ------------------------------------------------------------------------
  php:
    <<: *php-common
    environment:
      <<: *php-common-env
      PM_MAX_CHILDREN: ${PM_MAX_CHILDREN:-8}
    healthcheck:
      test: ["CMD", "php", "bin/healthcheck.php", "--db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --- Scheduler (ein Lauf je Datenbank, GET_LOCK) ------------------------------------------
  scheduler:
    <<: *php-background
    command: ["php", "bin/scheduler.php"]

  # --- Worker --------------------------------------------------------------------------------
  # memory_limit der Worker kommt bewusst per CLI-Flag (nicht ueber php.ini), damit ein Wert
  # (WORKER_MEMORY_MB) fuer alle Pools gilt, ohne das Web-php.ini zu beeinflussen (dort 256M fest).
  worker-lexware-1:
    <<: *php-background
    command: ["sh", "-c", "php -d memory_limit=${WORKER_MEMORY_MB:-512}M bin/worker.php --pool=lexware"]

  # Zweiter Lexware-Worker. In Staging ueber docker-compose.staging.yml (profiles) abgeschaltet.
  worker-lexware-2:
    <<: *php-background
    command: ["sh", "-c", "php -d memory_limit=${WORKER_MEMORY_MB:-512}M bin/worker.php --pool=lexware"]

  worker-stripe:
    <<: *php-background
    command: ["sh", "-c", "php -d memory_limit=${WORKER_MEMORY_MB:-512}M bin/worker.php --pool=stripe"]

  worker-mail:
    <<: *php-background
    command: ["sh", "-c", "php -d memory_limit=${WORKER_MEMORY_MB:-512}M bin/worker.php --pool=mail"]

  worker-maintenance:
    <<: *php-background
    command: ["sh", "-c", "php -d memory_limit=${WORKER_MEMORY_MB:-512}M bin/worker.php --pool=maintenance"]

  # --- Host-Metriken (Auftrag II/III: admin-system.php, Reiter Server) -----------------------
  # Laeuft wie alle Anwendungscontainer ohne Root und OHNE das Wurzeldateisystem des Hosts.
  # /proc des Hosts wird nur lesend eingebunden (CPU, Speicher, Load); die Plattenbelegung wird ueber
  # das Dateisystem gemessen, auf dem die Releases liegen (HOST_ROOT), das genuegt fuer die Anzeige.
  metrics:
    build: *php-build
    image: smarteinzug-php:local
    restart: unless-stopped
    user: "${APP_UID:-33}:${APP_GID:-33}"
    command: ["php", "bin/host-metrics.php", "--interval=60"]
    networks: [coolify, smarteinzug_internal]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SMARTEINZUG_CONFIG: /opt/smarteinzug/shared/config.php
      # Siehe x-php-common-env: eindeutiger Redis-Alias statt des mehrdeutigen "redis".
      SMARTEINZUG_REDIS_HOST: smarteinzug-redis
      SMARTEINZUG_REDIS_EXPECTED_CIDR: 172.28.0.0/24
      HOST_PROC: /hostproc
      HOST_ROOT: /opt/smarteinzug/releases
      # Lokale Kopie der Coolify-Datenbankbackups (nur lesend): der Sammler meldet Zeitpunkt und Groesse der
      # neuesten Sicherung als backup-status.json an das Monitoring (Admin > System, Komponente Sicherungen).
      COOLIFY_BACKUP_DIR: /coolify-backups
    # Eigener Healthcheck: Der Sammler schreibt keinen Worker-Heartbeat, der Anker *heartbeat-healthcheck
    # passt hier also nicht (er meldete beim ersten Deployment dauerhaft "ungesund" und brach deploy.sh ab).
    # --metrics prueft, dass bin/host-metrics.php als PID 1 laeuft UND die Schleife zuletzt innerhalb von
    # METRICS_MAX_AGE_SECONDS (Standard 300 s) einen Durchlauf beendet hat. Bewusst als Liste ohne
    # Shell-Ausdruck: so enthaelt der Healthcheck kein "$", das Docker Compose als Variable auswerten wuerde.
    healthcheck:
      test: ["CMD", "php", "bin/healthcheck.php", "--metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Wie bei php/scheduler/worker (x-php-common): working_dir bindet an das konkrete Release, nicht an
    # den mutable Symlink "current".
    working_dir: /opt/smarteinzug/releases/${RELEASE_SHA:?RELEASE_SHA muss vor jedem Compose-Aufruf gesetzt sein}
    volumes:
      - type: bind
        source: /opt/smarteinzug/releases
        target: /opt/smarteinzug/releases
        read_only: true
      - type: bind
        source: /opt/smarteinzug/shared/config.php
        target: /opt/smarteinzug/shared/config.php
        read_only: true
      - type: bind
        source: /opt/smarteinzug/shared/storage
        target: /opt/smarteinzug/shared/storage
      - /proc:/hostproc:ro
      # Pfad der lokalen Coolify-Backups auf dem Host (Standard /data/coolify/backups, auf dem Server pruefen).
      - ${COOLIFY_BACKUP_DIR:-/data/coolify/backups}:/coolify-backups:ro
    logging: *default-logging

  # --- Datenbank: KEIN Dienst hier. MariaDB 11.8 ist eine private Coolify-Datenbankressource (Datenbank
  #     smarteinzug), erreichbar fuer die PHP-Container ueber das Coolify-Netz unter ihrem Containernamen
  #     (db.host in shared/config.php). Kein veroeffentlichter Port, Backups durch Coolify (Hetzner Object
  #     Storage). Import von Bestandsdaten: scripts/db-import.sh (docker exec in den Coolify-Container).

  # --- Redis (Sperren, Ratenbegrenzung, Cache; kein persistenter Datenbestand noetig) -----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    # Eindeutiger DNS-Alias "smarteinzug-redis" zusaetzlich zum automatischen Alias "redis" (Dienstname).
    # "redis" kollidiert auf einem Coolify-Server mit Coolifys eigenem Redis im Netz "coolify" (siehe
    # x-php-common-env oben); der Alias existiert ausschliesslich im internen Netz, an dem Coolifys
    # Container nicht haengen, und ist damit fuer unsere PHP-Container eindeutig. Staging erhaelt denselben
    # Alias in seinem EIGENEN internen Netz (anderer Compose-Projektname), ohne Kollision mit Produktion.
    networks:
      smarteinzug_internal:
        aliases: [smarteinzug-redis]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # --- Backup: KEIN Dienst hier. Die taegliche Datenbanksicherung mit externem Ziel (Hetzner Object Storage)
  #     und der getestete Restore laufen ueber Coolify. Ein zweiter Dump-Container wuerde dieselbe Aufgabe
  #     unkontrolliert parallel uebernehmen. backup/restore-test.sh bleibt als Werkzeug fuer
  #     Wiederherstellungstests gegen eine temporaere Datenbank nutzbar (siehe README.md).
