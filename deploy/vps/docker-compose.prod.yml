# SmartEinzug: Override fuer den Produktions-VPS (app.smart-einzug.de, admin.smart-einzug.de,
# api.smart-einzug.de, status.smart-einzug.de). Immer zusammen mit docker-compose.yml verwenden:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d
#
# Enthaelt nur Ressourcenlimits, die zur tatsaechlichen Kapazitaet des Produktions-VPS passen.
# Alle Dienste inklusive des zweiten Lexware-Workers (worker-lexware-2) sind in der Basis-Datei
# definiert; Staging schaltet worker-lexware-2 ueber ein Profil ab (docker-compose.staging.yml).

services:
  caddy:
    mem_limit: 128m
    cpus: "0.50"

  php:
    mem_limit: 384m
    cpus: "1.00"

  scheduler:
    mem_limit: 128m
    cpus: "0.25"

  worker-lexware-1:
    mem_limit: 640m
    cpus: "0.50"

  worker-lexware-2:
    mem_limit: 640m
    cpus: "0.50"

  worker-stripe:
    mem_limit: 384m
    cpus: "0.50"

  worker-mail:
    mem_limit: 256m
    cpus: "0.25"

  worker-maintenance:
    mem_limit: 256m
    cpus: "0.25"

  metrics:
    mem_limit: 128m
    cpus: "0.25"

  mariadb:
    mem_limit: 1024m
    cpus: "1.50"

  redis:
    mem_limit: 320m
    cpus: "0.25"

  backup:
    mem_limit: 256m
    cpus: "0.50"
