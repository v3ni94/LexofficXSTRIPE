# SmartEinzug: Override fuer den Produktions-VPS (Hostinger KVM 8: 8 vCPU, 32 GB RAM, 400 GB NVMe;
# Ubuntu 24.04 mit Coolify). Immer zusammen mit docker-compose.yml verwenden:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d
#
# Enthaelt nur Ressourcenlimits. Sie sind bewusst deutlich unter der Kapazitaet des Servers angesetzt:
# Reserve fuer Betriebssystem, Coolify (eigene Postgres/Redis/Proxy, rund 2 GB), die Coolify-MariaDB
# (Limit dort setzen, Empfehlung 4 GB) und Lastspitzen.
# Summe der Limits unten rund 6 GB RAM (die Coolify-MariaDB wird in Coolify begrenzt) und 6 CPU-Anteile (Docker verteilt CPU anteilig, kein hartes
# Kontingent). Mehr Worker bringen wegen der API-Ratenbegrenzung von Lexware Office und Stripe nichts;
# die Anzahl bleibt bei zwei Lexware-Workern und je einem Worker fuer Stripe, Mail und Wartung.
# Alle Dienste inklusive worker-lexware-2 sind in der Basis-Datei definiert; Staging schaltet
# worker-lexware-2 ueber ein Profil ab (docker-compose.staging.yml).

services:
  caddy:
    mem_limit: 256m
    cpus: "0.50"

  php:
    mem_limit: 1536m
    cpus: "2.00"

  scheduler:
    mem_limit: 192m
    cpus: "0.25"

  worker-lexware-1:
    mem_limit: 768m
    cpus: "0.75"

  worker-lexware-2:
    mem_limit: 768m
    cpus: "0.75"

  worker-stripe:
    mem_limit: 512m
    cpus: "0.50"

  worker-mail:
    mem_limit: 256m
    cpus: "0.25"

  worker-maintenance:
    mem_limit: 384m
    cpus: "0.25"

  metrics:
    mem_limit: 128m
    cpus: "0.25"

  redis:
    mem_limit: 512m
    cpus: "0.25"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "384mb"]
