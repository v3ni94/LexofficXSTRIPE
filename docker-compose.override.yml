# Development overrides – applied automatically by docker compose
# Usage: docker compose up
services:
  db:
    ports:
      - "3306:3306"

  backend:
    command: ["--reload"]
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: mysql+aiomysql://lexsepa:${MYSQL_PASSWORD:-password}@db:3306/lexsepa
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"

  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    environment:
      DOMAIN: localhost
      NGINX_CONF: nginx.dev.conf
    ports:
      - "80:80"
    volumes: []
